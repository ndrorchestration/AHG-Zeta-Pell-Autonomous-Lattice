name: Credential History Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan-history:
    name: Scan reachable Git history
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all reachable Git blobs for secret-like credentials
        run: python3 scripts/scan_git_history_for_secrets.py
